# ============================================================
# CI — تست خودکار Nexify
# روی هر push / pull request به main اجرا می‌شود:
#   1) نصب وابستگی‌ها
#   2) بررسی سلامت جنگو (python manage.py check)
#   3) اجرای کامل pytest
#
# ⚠️ این فایل باید در ریشه‌ی ریپو بماند:
#    ریشه‌ی ریپو = پوشه‌ی Nexify/ (جایی که manage.py است)
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      # تغییر مدل بدون فایل مایگریشن → شکست CI
      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (pytest)
        run: pytest -v
