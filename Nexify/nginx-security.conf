# ============================================================
# Nexify — هدرهای امنیتی برای Nginx (فاز ۲)
# نحوه استفاده: محتوای داخل server {} را به کانفیگ سایت اضافه کنید:
#   sudo cp nginx-security.conf /etc/nginx/conf.d/nexify-security.conf
# یا محتوای block ها را داخل server {} خود کپی کنید، سپس:
#   sudo nginx -t && sudo systemctl reload nginx
# ⚠️ مهم: در Nginx اگر یک location هدر تعریف کند، هدرهای
#    سراسری به آن ارث‌بری نمی‌شوند — به همین دلیل هدرهای امنیتی
#    در داخل هر location نیز تکرار شده‌اند.
# ⚠️ پس از فعال‌سازی HTTPS، حتماً HSTS فعال بماند.
# ============================================================

server {
    # ---------- هدرهای امنیتی سراسری (صفحات اصلی) ----------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---------- Django Admin (/admin/) ----------
    # ⚠️ فاز ۴: سایت به جنگو منتقل شده — ادمین حالا /admin/ است (admin.html قدیمی حذف شد)
    # ⚠️ CSP ادمین را خود جنگو ارسال می‌کند (config/middleware.py)؛ script-src باید
    #    'unsafe-inline' داشته باشد چون تمپلیت‌های ادمین جنگو اسکریپت اینلاین دارند
    #    (change_form, popup_response, prepopulated_fields_js). این location با
    #    add_header های خودش، هدرهای سراسری (از جمله CSP سراسری) را برای /admin/ لغو می‌کند
    #    تا با هدر جنگو تداخل نشود.
    # 🔒 پیشنهاد: ادمین را به IP های خودتان محدود کنید:
    #    allow 192.168.1.0/24;
    #    allow 203.0.113.0/24;
    #    deny all;
    location ^~ /admin/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # ---------- فایل‌های استاتیک ----------
    # ⚠️ تا زمانی که نام فایل‌ها هش نشده (فاز ۴: collectstatic)،
    #    از max-age کوتاه استفاده کنید تا نسخه‌ی جدید بعد از دیپلوی دیده شود.
    location ~* \.(css|js|woff2)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
