{% load static %}
<nav class="navbar" id="navbar">
    <div class="container">
        <a href="{% url 'core:index' %}" class="nav-logo"><span class="nav-logo-dot"></span>NEXIFY</a>
        <ul class="nav-links">
            <li><a href="{% url 'core:index' %}" class="nav-link">خانه</a></li>
            <li><a href="{% url 'core:services' %}" class="nav-link">خدمات</a></li>
            <li><a href="{% url 'projects:list' %}" class="nav-link">نمونه کارها</a></li>
            <li><a href="{% url 'core:about' %}" class="nav-link">درباره ما</a></li>
            <li><a href="{% url 'blog:list' %}" class="nav-link">مقالات</a></li>
            <li><a href="{% url 'contact:index' %}" class="nav-link">تماس</a></li>
        </ul>
        <!-- وضعیت کاربر: واردشده → باکس واحد (پروفایل + خروج) | مهمان → ورود/ثبت‌نام (next باعث می‌شود بعد از ورود به همین صفحه برگردد). پنل مدیریت فقط از صفحه‌ی پروفایل قابل دسترسی است. -->
        <div class="nav-auth">
            {% if user.is_authenticated %}
            <div class="auth-user-box">
                <a href="{% url 'accounts:profile' %}" class="auth-user-chip" aria-label="پروفایل {{ user.username }}"><span class="auth-user-avatar" aria-hidden="true"><svg class="auth-user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><span class="auth-user-name">{{ user.username }}</span></a>
                <span class="auth-user-divider" aria-hidden="true"></span>
                <form method="post" action="{% url 'accounts:logout' %}" class="nav-logout-form">{% csrf_token %}<button type="submit" class="auth-btn-logout" aria-label="خروج از حساب"><svg class="auth-logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button></form>
            </div>
            {% else %}
            <a href="{% url 'accounts:login' %}?next={{ request.path }}" class="auth-btn auth-btn-login" aria-label="ورود">ورود</a>
            <a href="{% url 'accounts:register' %}?next={{ request.path }}" class="auth-btn auth-btn-register" aria-label="ثبت‌نام">ثبت‌نام</a>
            {% endif %}
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="تغییر تم"><span class="theme-icon-light"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span><span class="theme-icon-dark"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span></button>
        <button type="button" class="mobile-toggle" id="mobileToggle" aria-label="منو"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
    </div>
</nav>
